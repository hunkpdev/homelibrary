databaseChangeLog:
  - changeSet:
      id: 008-create-demo-isbn-daily-stats
      author: homelibrary
      changes:
        - createTable:
            tableName: demo_isbn_daily_stats
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lookup_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: lookup_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
