# HSQLDB in-memory
spring.datasource.url=jdbc:hsqldb:mem:homelibrary;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Embedded Tomcat
server.port=8080

# Secure cookie requires HTTPS – disabled on localhost
app.cookie.secure=false
# Localhost is same-site; Strict is sufficient and avoids SameSite=None without Secure
app.cookie.same-site=Strict

# CORS – Vite dev server
app.cors.allowed-origin=http://localhost:5173

