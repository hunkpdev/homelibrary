name: Extract Native Libraries

on:
  workflow_dispatch:

jobs:
  extract-libyaz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}

      - name: Build libyaz4j.so from source and collect transitive .so closure (Ubuntu 24.04)
        # libyaz.so.5 and its transitive deps are built/collected from Ubuntu 24.04.
        # glibc compatibility with Lambda AL2023 (glibc 2.34) is verified by the
        # "Validate native lib closure" step below using the actual Lambda Java 21 runtime image.
        run: |
          mkdir -p backend/src/main/resources/native/linux-x86_64
          mkdir -p backend/src/main/resources/native/Linux/amd64
          mkdir -p backend/src/main/resources/lib
          docker run --rm \
            -v "${{ github.workspace }}/backend/src/main/resources/native:/output-native" \
            -v "${{ github.workspace }}/backend/src/main/resources/lib:/output-lib" \
            ubuntu:24.04 \
            bash -c "
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                build-essential libyaz-dev default-jdk-headless maven swig git pkg-config &&
              git clone --depth 1 https://github.com/indexdata/yaz4j.git &&
              cd yaz4j &&
              mvn package -DskipTests -q &&
              LIBYAZ4J=\$(find target/native -name 'libyaz4j.so' | head -1) &&
              cp \"\$LIBYAZ4J\" /output-native/Linux/amd64/libyaz4j.so &&
              cp /usr/lib/x86_64-linux-gnu/libyaz.so.5 /output-native/linux-x86_64/libyaz.so.5 &&
              cp /usr/lib/x86_64-linux-gnu/libyaz.so.5 /output-lib/libyaz.so.5 &&
              { ldd \"\$LIBYAZ4J\"; ldd /usr/lib/x86_64-linux-gnu/libyaz.so.5; } \
                | awk '\$3 ~ \"^/\" {print \$3}' \
                | sort -u \
                | grep -Ev '/(libc|libpthread|libdl|libm|librt|ld-linux|libstdc\+\+|linux-vdso)\.so' \
                | xargs -I{} cp -L {} /output-lib/
            "

      - name: Validate native lib closure against Lambda AL2023 runtime
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/backend/src/main/resources/lib:/var/task/lib:ro" \
            -e LD_LIBRARY_PATH=/var/task/lib \
            --entrypoint /bin/bash \
            public.ecr.aws/lambda/java:21 \
            -c "
              set -e
              echo '=== libyaz.so.5 ldd ==='
              ldd /var/task/lib/libyaz.so.5
              if ldd /var/task/lib/libyaz.so.5 | grep -q 'not found'; then
                echo 'ERROR: Missing transitive .so dependency in resources/lib/'
                exit 1
              fi
              echo 'OK: all transitive deps resolve under /var/task/lib + Lambda AL2023 system paths.'
            "

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/native/linux-x86_64/libyaz.so.5
          git add backend/src/main/resources/native/Linux/amd64/libyaz4j.so
          git add backend/src/main/resources/lib/
          git diff --staged --quiet || git commit -m "chore: add libyaz native libraries with transitive .so closure for Lambda"
          git push
