name: Extract Native Libraries

on:
  workflow_dispatch:

jobs:
  extract-libyaz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}

      - name: Extract libyaz.so.5 and libyaz4j.so via Index Data APT
        run: |
          mkdir -p backend/src/main/resources/native/linux-x86_64
          mkdir -p backend/src/main/resources/native/Linux/amd64
          docker run --rm \
            -v "${{ github.workspace }}/backend/src/main/resources/native:/output" \
            ubuntu:20.04 \
            bash -c "
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y wget gnupg &&
              wget -q https://ftp.indexdata.com/pub/ubuntu/indexdata.gpg -O /etc/apt/trusted.gpg.d/indexdata.gpg &&
              echo 'deb https://ftp.indexdata.com/pub/ubuntu focal main' > /etc/apt/sources.list.d/indexdata.list &&
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y libyaz4j &&
              find /usr -name 'libyaz.so.5' | head -1 | xargs -I{} cp {} /output/linux-x86_64/libyaz.so.5 &&
              find /usr -name 'libyaz4j.so' | head -1 | xargs -I{} cp {} /output/Linux/amd64/libyaz4j.so
            "

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/native/linux-x86_64/libyaz.so.5
          git add backend/src/main/resources/native/Linux/amd64/libyaz4j.so
          git diff --staged --quiet || git commit -m "chore: add libyaz.so.5 and libyaz4j.so native libraries from Index Data APT"
          git push
