name: Extract Native Libraries

on:
  workflow_dispatch:

jobs:
  extract-libyaz:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.ref }}

      - name: Build libyaz4j.so from source (Ubuntu)
        run: |
          mkdir -p backend/src/main/resources/native/Linux/amd64
          docker run --rm \
            -v "${{ github.workspace }}/backend/src/main/resources/native:/output" \
            ubuntu:24.04 \
            bash -c "
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libyaz-dev default-jdk-headless maven swig git pkg-config &&
              git clone --depth 1 https://github.com/indexdata/yaz4j.git &&
              cd yaz4j &&
              mvn package -DskipTests -q &&
              find target/native -name 'libyaz4j.so' | head -1 | xargs -I{} cp {} /output/Linux/amd64/libyaz4j.so
            "

      - name: Extract libyaz.so.5 from Lambda Java 21 image
        run: |
          mkdir -p backend/src/main/resources/native/linux-x86_64
          docker run --rm \
            -v "${{ github.workspace }}/backend/src/main/resources/native:/output" \
            public.ecr.aws/lambda/java:21 \
            sh -c "dnf install -y yaz && cp /usr/lib64/libyaz.so.5 /output/linux-x86_64/libyaz.so.5"

      - name: Commit native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/resources/native/linux-x86_64/libyaz.so.5
          git add backend/src/main/resources/native/Linux/amd64/libyaz4j.so
          git diff --staged --quiet || git commit -m "chore: add libyaz.so.5 and libyaz4j.so native libraries from Index Data APT"
          git push
